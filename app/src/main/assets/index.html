<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lumen TV</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%233ee0c5'/%3E%3Cstop offset='1' stop-color='%238b7cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='2' y='2' width='28' height='28' rx='9' fill='url(%23g)'/%3E%3Cpath d='M12.5 9.5v13h8' stroke='%2305070c' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='21.5' cy='11' r='2' fill='%2305070c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05070c; --bg1:#090d15; --bg2:#0e131e; --bg3:#151b29; --bg4:#1c2334;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --text:#e9edf5; --dim:#9ba4b6; --faint:#5f687b;
  --accent:#3ee0c5; --accent-rgb:62,224,197; --ink:#041210; --accent2:#8b7cf6;
  --live:#ff4d6d; --warn:#f5a524;
  --r:14px; --rail:4.6rem; --scale:1; --base:15px;
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (min-width:900px){:root{--base:clamp(14px, calc(.55vw + 9px), 19px)}}
*{box-sizing:border-box}
html{font-size:calc(var(--base) * var(--scale));height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums}
input,textarea{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit}
svg.i{width:1.25rem;height:1.25rem;flex:none;display:block}
:focus{outline:none}
body.kbd :focus{outline:2px solid var(--accent);outline-offset:2px}
.hide{display:none!important}
.dim{color:var(--dim)} .faint{color:var(--faint)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.clamp4{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:8px} ::-webkit-scrollbar-track{background:transparent}

/* ---------- app shell ---------- */
.app{position:fixed;inset:0;display:flex}
.rail{position:absolute;left:0;top:0;bottom:0;width:var(--rail);z-index:30;display:flex;flex-direction:column;padding:1.1rem .65rem;background:linear-gradient(180deg,#080b13,#05070c);border-right:1px solid var(--line);transition:width .22s ease,box-shadow .22s}
.rail.open{width:14.5rem;box-shadow:24px 0 60px rgba(0,0,0,.65)}
.brand{display:flex;align-items:center;gap:.7rem;height:2.6rem;padding:0 .35rem;margin-bottom:1.4rem;white-space:nowrap;overflow:hidden}
.brand svg{width:2.2rem;height:2.2rem;flex:none}
.brand b{font-size:1.25rem;font-weight:600;letter-spacing:-.01em;opacity:0;transition:opacity .2s}
.rail.open .brand b{opacity:1}
.rail-items{display:flex;flex-direction:column;gap:.3rem}
.ri{position:relative;display:flex;align-items:center;gap:.95rem;height:2.9rem;padding:0 .8rem;border:0;border-radius:.85rem;background:none;color:var(--dim);cursor:pointer;white-space:nowrap;overflow:hidden;text-align:left;font-size:.98rem}
.ri svg{width:1.35rem;height:1.35rem}
.ri span{opacity:0;transition:opacity .2s}
.rail.open .ri span{opacity:1}
.ri.cur{color:var(--text);background:rgba(255,255,255,.06)}
.ri.cur::before{content:'';position:absolute;left:0;top:.75rem;bottom:.75rem;width:3px;border-radius:3px;background:var(--accent)}
body.kbd .ri:focus{outline:none;background:var(--accent);color:var(--ink)}
body.kbd .ri:focus::before{display:none}
@media (hover:hover){.ri:hover{color:var(--text)}}
.rail-foot{margin-top:auto;padding:0 .35rem;white-space:nowrap;overflow:hidden}
.rail-clock{font-size:1rem;font-weight:500}
.rail-clock small{font-size:.7em;color:var(--dim);display:none}
.rail.open .rail-clock small{display:inline}
.rail-date{font-size:.72rem;color:var(--faint);margin-top:.1rem;opacity:0;transition:opacity .2s}
.rail.open .rail-date{opacity:1}
#views{position:absolute;left:var(--rail);right:0;top:0;bottom:0;min-width:0}
.app.immersive .rail{display:none}
.app.immersive #views{left:0}
.view{position:absolute;inset:0;display:none;overflow:hidden}
.view.on{display:flex}
.vtitle{font-size:1.55rem;font-weight:600;letter-spacing:-.01em;margin:0}
.vsub{color:var(--dim);font-size:.9rem;margin-top:.2rem}

/* ---------- buttons, chips, badges ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;height:2.75rem;padding:0 1.2rem;border-radius:.85rem;border:1px solid var(--line2);background:rgba(255,255,255,.05);color:var(--text);font-weight:500;font-size:.95rem;cursor:pointer;white-space:nowrap;transition:transform .15s,background .15s}
.btn svg{width:1.2rem;height:1.2rem}
.btn.pri{background:var(--accent);color:var(--ink);border-color:transparent;font-weight:600}
.btn.ghost{background:transparent;border-color:transparent}
.btn.sm{height:2.2rem;padding:0 .85rem;font-size:.85rem;border-radius:.7rem}
.btn.icon{width:2.75rem;padding:0}
.btn.sm.icon{width:2.2rem}
.btn.danger{color:#ff8fa3}
.btn[disabled]{opacity:.4}
body.kbd .btn:focus{outline:none;background:var(--text);color:var(--bg);border-color:transparent;transform:scale(1.05)}
@media (hover:hover){.btn:hover{border-color:rgba(255,255,255,.3)} .btn.pri:hover{filter:brightness(1.08)}}
.chip{display:inline-flex;align-items:center;gap:.4rem;height:2.2rem;padding:0 .9rem;border-radius:2rem;border:1px solid var(--line2);background:transparent;color:var(--dim);font-size:.85rem;cursor:pointer;white-space:nowrap}
.chip.cur{background:rgba(var(--accent-rgb),.14);border-color:rgba(var(--accent-rgb),.5);color:var(--accent)}
body.kbd .chip:focus{outline:none;background:var(--accent);color:var(--ink);border-color:transparent}
.badge{display:inline-flex;align-items:center;gap:.3rem;height:1.35rem;padding:0 .5rem;border-radius:.4rem;font-size:.66rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;background:rgba(255,255,255,.08);color:var(--dim);white-space:nowrap}
.badge svg{width:.85rem;height:.85rem}
.badge.live{background:var(--live);color:#fff}
.badge.acc{background:rgba(var(--accent-rgb),.15);color:var(--accent)}
.badge.warn{background:rgba(245,165,36,.15);color:var(--warn)}
.pbar{height:3px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.kicker{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600}
.spin{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{margin:auto;text-align:center;max-width:28rem;padding:2rem;color:var(--dim)}
.empty .eic{width:4rem;height:4rem;margin:0 auto 1rem;border-radius:1.2rem;display:grid;place-items:center;background:rgba(var(--accent-rgb),.1);color:var(--accent)}
.empty .eic svg{width:2rem;height:2rem}
.empty h3{color:var(--text);font-weight:600;font-size:1.25rem;margin:0 0 .5rem}
.empty .btn{margin-top:1.2rem}

/* ---------- logos & cards ---------- */
.logo{width:3.4rem;height:2.3rem;flex:none;border-radius:.55rem;display:grid;place-items:center;overflow:hidden;background:rgba(255,255,255,.05)}
.logo img{max-width:86%;max-height:78%;object-fit:contain;display:block}
.logo .ini{font-weight:700;font-size:.82rem;letter-spacing:.03em;color:rgba(255,255,255,.92)}
.logo.lg{width:5rem;height:3.4rem;border-radius:.7rem}
.logo.lg .ini{font-size:1.15rem}

/* ---------- virtual scroll ---------- */
.vs{position:relative;overflow-y:auto;overflow-x:hidden;flex:1;min-height:0;scrollbar-width:none}
.vs::-webkit-scrollbar{display:none}
.vs-in{position:relative;width:100%}
.vc{position:absolute;cursor:pointer}

/* ---------- groups column ---------- */
.groups{width:15.5rem;flex:none;display:flex;flex-direction:column;border-right:1px solid var(--line);padding:1.3rem .6rem 1rem;overflow-y:auto;scrollbar-width:none;gap:.12rem}
.groups::-webkit-scrollbar{display:none}
.gh{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:.2rem .8rem .7rem;font-weight:600}
.gi{display:flex;align-items:center;gap:.65rem;width:100%;min-height:2.6rem;padding:.4rem .8rem;border:0;border-radius:.7rem;color:var(--dim);background:none;font-size:.92rem;text-align:left;cursor:pointer}
.gi svg{width:1.05rem;height:1.05rem;opacity:.8}
.gi .gl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gi .ct{font-size:.74rem;color:var(--faint)}
.gi.cur{color:var(--text);background:rgba(255,255,255,.06)}
body.kbd .gi:focus{outline:none;background:var(--accent);color:var(--ink)}
body.kbd .gi:focus .ct{color:inherit;opacity:.7}
@media (hover:hover){.gi:hover{color:var(--text)}}

/* ---------- channel rows ---------- */
.chrow{display:flex;align-items:center;gap:.8rem;padding:0 .9rem 0 .5rem;border-radius:.8rem;margin:0 .2rem}
.chrow .num{width:2.5rem;flex:none;text-align:right;color:var(--faint);font-size:.82rem}
.chrow .mid{flex:1;min-width:0}
.chrow .nm{font-size:.98rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chrow .np{font-size:.8rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.12rem}
.chrow .pbar{margin-top:.35rem;max-width:12rem}
.chrow .tags{display:flex;gap:.35rem;color:var(--faint)}
.chrow .tags svg{width:1rem;height:1rem}
.chrow .tags .fav{color:var(--warn)}
.chrow.playing .nm{color:var(--accent)}
.chrow.sel{background:rgba(255,255,255,.04)}
body.kbd .chrow:focus{outline:none;background:linear-gradient(90deg,rgba(var(--accent-rgb),.24),rgba(var(--accent-rgb),.07));box-shadow:inset 3px 0 0 var(--accent)}
body.kbd .chrow:focus .num{color:var(--accent)}
@media (hover:hover){.chrow:hover{background:rgba(255,255,255,.05)}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:.8rem;margin-left:.4rem}
.eq i{width:3px;background:var(--accent);border-radius:1px;animation:eq 1s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s} .eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:30%}50%{height:100%}}

/* ---------- live view ---------- */
.live .chans{flex:1;min-width:0;display:flex;flex-direction:column;padding:1.2rem .4rem 0}
.chans-h{display:flex;align-items:baseline;gap:.8rem;padding:0 1rem .9rem}
.chans-h .vtitle{font-size:1.35rem}
.live .pv{width:38%;max-width:36rem;flex:none;display:flex;flex-direction:column;gap:1rem;padding:1.3rem 1.5rem;border-left:1px solid var(--line);overflow:hidden}
.slot{position:relative;width:100%;aspect-ratio:16/9;border-radius:var(--r);background:#000;overflow:hidden;flex:none;cursor:pointer}
.slot .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;color:var(--faint);font-size:.85rem;background:radial-gradient(ellipse at 50% 40%,rgba(var(--accent-rgb),.08),transparent 70%),#06080d;border:1px solid var(--line);border-radius:var(--r)}
.pv h3{margin:0;font-size:1.3rem;font-weight:600;line-height:1.2}
.pv .meta{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem .6rem;color:var(--dim);font-size:.85rem}
.pv .desc{color:var(--dim);font-size:.88rem;line-height:1.5}
.upn{display:flex;flex-direction:column;gap:.15rem;margin-top:.2rem}
.upn .uh{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:.35rem}
.upn .ui{display:flex;gap:.9rem;font-size:.88rem;padding:.3rem 0;border-top:1px solid var(--line)}
.upn .ui .tt{color:var(--faint);width:4.6rem;flex:none}

/* ---------- home ---------- */
#v-home{flex-direction:column;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;padding-bottom:2rem}
#v-home::-webkit-scrollbar{display:none}
.hero{position:relative;display:flex;gap:2.4rem;align-items:center;padding:2.2rem 2.6rem 1.4rem;min-height:23rem;flex:none}
.hero::before{content:'';position:absolute;inset:-30% -10% 0 30%;background:radial-gradient(ellipse at 70% 40%,rgba(var(--accent-rgb),.13),transparent 60%),radial-gradient(ellipse at 30% 60%,rgba(139,124,246,.10),transparent 60%);pointer-events:none}
.hero-info{position:relative;flex:1;min-width:0;max-width:36rem}
.hero h1{font-size:2.6rem;line-height:1.04;margin:.55rem 0 .7rem;font-weight:600;letter-spacing:-.025em}
.hero .hmeta{display:flex;align-items:center;gap:.7rem;color:var(--dim);font-size:.92rem;flex-wrap:wrap}
.hero .hdesc{color:var(--dim);line-height:1.55;margin:.9rem 0 0;font-size:.95rem}
.hero .pbar{margin-top:1rem;max-width:22rem}
.hero .hbtns{display:flex;gap:.7rem;margin-top:1.5rem;flex-wrap:wrap}
.hero-slot{position:relative;width:46%;max-width:46rem;flex:none}
.hero-art{position:relative;width:46%;max-width:46rem;flex:none;aspect-ratio:16/9;border-radius:1.2rem;overflow:hidden;background:#070a11;border:1px solid var(--line)}
.hero-art .ga{position:absolute;inset:0;padding:8% 6%;display:flex;flex-direction:column;gap:5%}
.hero-art .gl{display:flex;gap:3%;height:14%}
.hero-art .gl i{border-radius:.5rem;background:rgba(255,255,255,.06)}
.hero-art .gl i.a{background:rgba(var(--accent-rgb),.35)}
.hero-art .glow{position:absolute;width:60%;height:60%;right:-10%;top:-15%;background:radial-gradient(circle,rgba(var(--accent-rgb),.35),transparent 65%)}
.rowh{display:flex;align-items:baseline;gap:.7rem;padding:0 2.6rem;margin:1.3rem 0 .2rem;font-size:1.12rem;font-weight:600}
.rowh .c{color:var(--faint);font-size:.8rem;font-weight:400}
.cards{display:flex;gap:1rem;overflow-x:auto;overflow-y:hidden;padding:.8rem 2.6rem 1rem;scrollbar-width:none;scroll-padding:0 2.6rem;flex:none}
.cards::-webkit-scrollbar{display:none}
.ccard{position:relative;flex:none;width:15.5rem;border-radius:var(--r);background:var(--bg2);border:1px solid var(--line);overflow:hidden;cursor:pointer;transition:transform .18s,box-shadow .18s}
.ccard .art{position:relative;aspect-ratio:16/9;display:grid;place-items:center}
.ccard .art img{max-width:52%;max-height:52%;object-fit:contain}
.ccard .art .ini{font-size:1.7rem;font-weight:700;color:rgba(255,255,255,.9)}
.ccard .art .badge{position:absolute;left:.6rem;top:.6rem}
.ccard .meta{padding:.7rem .85rem .85rem}
.ccard .t1{font-size:.92rem;font-weight:500}
.ccard .t2{font-size:.78rem;color:var(--dim);margin-top:.15rem}
.ccard .pbar{margin-top:.55rem}
body.kbd .ccard:focus,body.kbd .pcard:focus .pst{outline:none;transform:scale(1.06);box-shadow:0 0 0 3px var(--accent),0 18px 40px rgba(0,0,0,.55);z-index:2}
@media (hover:hover){.ccard:hover{transform:translateY(-3px)}}
.pcard{flex:none;width:9.6rem;cursor:pointer}
.pcard .pst{position:relative;aspect-ratio:2/3;border-radius:.8rem;overflow:hidden;background:var(--bg3);transition:transform .18s,box-shadow .18s}
.pcard .pst img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .pt{font-size:.84rem;margin-top:.5rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .py{font-size:.72rem;color:var(--faint)}
.pcard .pbar{position:absolute;left:.5rem;right:.5rem;bottom:.5rem}
.rate{position:absolute;right:.45rem;top:.45rem;background:rgba(5,7,12,.78);color:var(--warn);font-size:.68rem;font-weight:700;padding:.18rem .4rem;border-radius:.35rem}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:.8rem;font-weight:700;font-size:1.05rem;line-height:1.1;letter-spacing:-.01em}
.gen small{display:block;font-size:.58rem;letter-spacing:.2em;opacity:.6;font-weight:600;margin-bottom:.4rem}

/* ---------- guide ---------- */
#v-guide{flex-direction:column}
.g-top{display:flex;gap:1.6rem;padding:1.1rem 1.5rem .8rem;flex:none;height:13rem}
.g-detail{flex:1;min-width:0;display:flex;flex-direction:column;gap:.45rem}
.g-detail h2{margin:.1rem 0 0;font-size:1.55rem;font-weight:600;letter-spacing:-.015em;line-height:1.15}
.g-detail .meta{display:flex;flex-wrap:wrap;gap:.4rem .7rem;align-items:center;color:var(--dim);font-size:.86rem}
.g-detail .desc{color:var(--dim);font-size:.86rem;line-height:1.5}
.g-detail .hint{margin-top:auto;font-size:.74rem;color:var(--faint)}
.g-slot{width:20rem;flex:none;align-self:flex-start}
.g-bar{display:flex;align-items:center;gap:.5rem;padding:0 1.5rem .65rem;flex:none;overflow-x:auto;scrollbar-width:none}
.g-bar::-webkit-scrollbar{display:none}
.g-bar .sp{flex:1}
.g-grid{--chw:13.5rem;--rowh:3.7rem;--hh:2.3rem;position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.g-grid::-webkit-scrollbar{display:none}
.g-inner{position:relative}
.g-head{position:sticky;top:0;z-index:5;height:var(--hh);background:var(--bg);border-bottom:1px solid var(--line)}
.g-corner{position:sticky;left:0;z-index:6;width:var(--chw);height:100%;background:var(--bg);display:flex;align-items:center;padding:0 .9rem;font-size:.78rem;color:var(--accent);font-weight:600;border-right:1px solid var(--line)}
.tick{position:absolute;top:0;height:100%;padding-left:.5rem;border-left:1px solid var(--line);font-size:.76rem;color:var(--dim);line-height:var(--hh);white-space:nowrap}
.tick.day{color:var(--accent);font-weight:600}
.g-row{position:absolute;left:0;height:var(--rowh);border-bottom:1px solid var(--line)}
.g-ch{position:sticky;left:0;z-index:3;width:var(--chw);height:100%;display:flex;align-items:center;gap:.6rem;padding:0 .7rem;background:var(--bg1);border-right:1px solid var(--line);cursor:pointer}
.g-ch .num{font-size:.75rem;color:var(--faint);width:1.9rem;text-align:right;flex:none}
.g-ch .logo{width:2.9rem;height:2rem}
.g-ch .nm{font-size:.86rem;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-row.cur .g-ch{background:#0f1522}
.g-row.cur .g-ch .nm{color:var(--accent)}
.gp{position:absolute;top:.22rem;bottom:.22rem;border-radius:.55rem;background:var(--bg3);padding:.36rem .6rem;overflow:hidden;cursor:pointer;min-width:2px}
.gp .t{font-size:.86rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp .tm{font-size:.7rem;color:var(--dim);white-space:nowrap;overflow:hidden;margin-top:.1rem;display:flex;gap:.35rem;align-items:center}
.gp .tm svg{width:.8rem;height:.8rem}
.gp.cut .t,.gp.cut .tm{visibility:hidden}
.gp.live{background:#12202a;box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.28)}
.gp.live .t{color:#fff}
.gp.past{background:#0c111b}
.gp.past .t{color:var(--dim)}
.gp.fill{background:repeating-linear-gradient(135deg,#0b1019 0 8px,#0d121c 8px 16px)}
.gp.fill .t{color:var(--faint);font-weight:400}
.gp.rem .t::before{content:'';display:inline-block;width:.45rem;height:.45rem;border-radius:50%;background:var(--warn);margin-right:.4rem;vertical-align:.12rem}
body.kbd .gp:focus,.gp.sel{outline:none;background:var(--accent)!important;box-shadow:none}
body.kbd .gp:focus .t,body.kbd .gp:focus .tm,.gp.sel .t,.gp.sel .tm{color:var(--ink)!important}
.g-now{position:absolute;top:0;width:2px;background:var(--live);z-index:2;pointer-events:none;box-shadow:0 0 12px rgba(255,77,109,.6)}
.g-now::before{content:'';position:absolute;top:0;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--live)}
.g-status{font-size:.75rem;color:var(--faint);white-space:nowrap}

/* ---------- vod ---------- */
.vod-main{flex:1;min-width:0;display:flex;flex-direction:column;padding:1.3rem .6rem 0 1rem}
.vod-h{display:flex;align-items:center;gap:.8rem;padding:0 1rem 1rem}
.vod-h .sp{flex:1}
.vc.pc{padding:.55rem}
.vc.pc .pcard{width:100%}
.vc.pc .pst{transition:transform .18s,box-shadow .18s}
body.kbd .vc.pc:focus{outline:none}
body.kbd .vc.pc:focus .pst{transform:scale(1.06);box-shadow:0 0 0 3px var(--accent),0 18px 40px rgba(0,0,0,.6)}
.detail{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;opacity:0;transition:opacity .2s}
.detail.on{opacity:1}
.detail .bgimg{position:absolute;inset:-5%;background-size:cover;background-position:center;filter:blur(40px) brightness(.35) saturate(1.3);transform:scale(1.1)}
body.lite .detail .bgimg{filter:none;opacity:.18}
.detail .shade{position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 0%,rgba(5,7,12,.85) 45%,rgba(5,7,12,.55))}
.detail .dwrap{position:relative;display:flex;gap:2.6rem;padding:3rem 3.4rem;width:100%;overflow-y:auto}
.detail .dposter{width:15rem;flex:none;align-self:flex-start;aspect-ratio:2/3;border-radius:1rem;overflow:hidden;position:relative;background:var(--bg3);box-shadow:0 30px 60px rgba(0,0,0,.5)}
.detail .dposter img{width:100%;height:100%;object-fit:cover}
.detail .dinfo{flex:1;min-width:0;max-width:50rem}
.detail h1{font-size:2.4rem;font-weight:600;letter-spacing:-.02em;margin:.4rem 0 .6rem;line-height:1.08}
.detail .dmeta{display:flex;flex-wrap:wrap;gap:.5rem .9rem;color:var(--dim);font-size:.92rem;align-items:center}
.detail .dplot{color:#c9d0dd;line-height:1.6;margin:1.1rem 0;font-size:.98rem}
.detail .dcast{color:var(--faint);font-size:.85rem;line-height:1.5}
.detail .dbtns{display:flex;gap:.7rem;margin:1.4rem 0;flex-wrap:wrap}
.seasons{display:flex;gap:.5rem;flex-wrap:wrap;margin:1.2rem 0 .8rem}
.eps{display:flex;flex-direction:column;gap:.35rem}
.ep{display:flex;gap:1rem;align-items:flex-start;width:100%;text-align:left;padding:.75rem .9rem;border-radius:.8rem;border:0;background:rgba(255,255,255,.035);cursor:pointer}
.ep .en{font-size:1.1rem;font-weight:600;color:var(--faint);width:2.2rem;flex:none}
.ep .et{font-weight:500}
.ep .ed{color:var(--dim);font-size:.82rem;margin-top:.2rem;line-height:1.45}
.ep .pbar{margin-top:.5rem;max-width:14rem}
body.kbd .ep:focus{outline:none;background:rgba(var(--accent-rgb),.18);box-shadow:inset 3px 0 0 var(--accent)}

/* ---------- search ---------- */
#v-search{flex-direction:column;padding:1.6rem 2.2rem 0}
.sbox{display:flex;align-items:center;gap:.8rem;height:3.4rem;padding:0 1.2rem;border-radius:1rem;background:var(--bg2);border:1px solid var(--line2);flex:none;max-width:48rem}
.sbox svg{color:var(--faint)}
.sbox input{flex:1;height:100%;border:0;background:none;color:var(--text);font:inherit;font-size:1.1rem;outline:none}
body.kbd .sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.25)}
.sres{flex:1;overflow-y:auto;padding:1rem 0 2rem;scrollbar-width:none}
.sres::-webkit-scrollbar{display:none}
.ssec{margin-top:1.2rem}
.ssec h4{margin:0 0 .5rem;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.srs{display:flex;flex-direction:column;gap:.25rem;max-width:56rem}
.sr{display:flex;align-items:center;gap:.9rem;width:100%;min-height:3.4rem;padding:.4rem .8rem;border:0;border-radius:.8rem;background:none;text-align:left;cursor:pointer}
.sr .mid{flex:1;min-width:0}
.sr .a{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr .b{font-size:.8rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:.1rem}
.sr .when{font-size:.8rem;color:var(--faint);text-align:right;flex:none}
body.kbd .sr:focus{outline:none;background:rgba(var(--accent-rgb),.18);box-shadow:inset 3px 0 0 var(--accent)}
@media (hover:hover){.sr:hover{background:rgba(255,255,255,.04)}}
.stip{color:var(--faint);font-size:.9rem;margin-top:1.4rem;line-height:1.7}
kbd{display:inline-block;min-width:1.5rem;padding:0 .35rem;border-radius:.35rem;background:rgba(255,255,255,.08);border:1px solid var(--line2);font-family:inherit;font-size:.78rem;text-align:center;color:var(--text)}

/* ---------- settings ---------- */
.set{display:flex;width:100%}
.set-main{flex:1;min-width:0;overflow-y:auto;padding:1.6rem 2.4rem 3rem;scrollbar-width:none}
.set-main::-webkit-scrollbar{display:none}
.set-main .vtitle{margin-bottom:.3rem}
.set-main .vsub{margin-bottom:1.4rem}
.sgrp{margin:1.6rem 0 .6rem;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.srow{display:flex;align-items:center;gap:1rem;width:100%;max-width:52rem;min-height:3.5rem;padding:.65rem 1.1rem;margin-bottom:.4rem;border:0;border-radius:.85rem;background:rgba(255,255,255,.035);text-align:left;cursor:pointer}
.srow .lab{flex:1;min-width:0}
.srow .lab b{display:block;font-weight:500;font-size:.96rem}
.srow .lab small{display:block;color:var(--dim);font-size:.8rem;margin-top:.15rem;line-height:1.4}
.srow .val{color:var(--dim);font-size:.88rem;white-space:nowrap;display:flex;align-items:center;gap:.4rem}
.srow .val svg{width:1rem;height:1rem}
body.kbd .srow:focus{outline:none;background:rgba(var(--accent-rgb),.16);box-shadow:inset 0 0 0 2px var(--accent)}
@media (hover:hover){.srow:hover{background:rgba(255,255,255,.06)}}
.tog{position:relative;width:2.7rem;height:1.55rem;border-radius:1rem;background:rgba(255,255,255,.15);flex:none;transition:background .2s}
.tog::after{content:'';position:absolute;left:.2rem;top:.2rem;width:1.15rem;height:1.15rem;border-radius:50%;background:#fff;transition:transform .2s}
.tog.on{background:var(--accent)}
.tog.on::after{transform:translateX(1.15rem)}
.swatches{display:flex;gap:.6rem}
.sw{width:2.2rem;height:2.2rem;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.cur{border-color:#fff}
body.kbd .sw:focus{outline:none;transform:scale(1.18);box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.plcard{display:flex;align-items:center;gap:1rem;max-width:52rem;padding:1rem 1.1rem;margin-bottom:.6rem;border-radius:1rem;background:rgba(255,255,255,.035);border:1px solid var(--line)}
.plcard.act{border-color:rgba(var(--accent-rgb),.45);background:rgba(var(--accent-rgb),.06)}
.plcard .pic{width:2.8rem;height:2.8rem;border-radius:.8rem;display:grid;place-items:center;background:rgba(var(--accent-rgb),.12);color:var(--accent);flex:none}
.plcard .pm{flex:1;min-width:0}
.plcard .pm b{font-weight:500}
.plcard .pm small{display:block;color:var(--dim);font-size:.8rem;margin-top:.2rem}
.plcard .pb{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end}

/* ---------- forms ---------- */
.fld{display:block;margin-bottom:.9rem}
.fld > span{display:block;font-size:.8rem;color:var(--dim);margin-bottom:.35rem}
.inp{width:100%;height:2.9rem;padding:0 .95rem;border-radius:.75rem;border:1px solid var(--line2);background:#070a10;color:var(--text);font:inherit;font-size:.95rem}
body.kbd .inp:focus,.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.2)}
.seg{display:flex;gap:.35rem;padding:.3rem;border-radius:.9rem;background:rgba(255,255,255,.04);margin-bottom:1.2rem;flex-wrap:wrap}
.seg .chip{flex:1;justify-content:center;border:0;border-radius:.65rem}
.note{font-size:.8rem;color:var(--dim);line-height:1.5;padding:.7rem .9rem;border-radius:.7rem;background:rgba(var(--accent-rgb),.07);border:1px solid rgba(var(--accent-rgb),.2);margin:.2rem 0 1rem}
.note.warn{background:rgba(245,165,36,.07);border-color:rgba(245,165,36,.25)}

/* ---------- layers: modal, sheet, side panel ---------- */
#layers > *{opacity:0;transition:opacity .18s}
#layers > .on{opacity:1}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(2,3,6,.72);padding:1rem}
.mcard{width:min(36rem,100%);max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:1.3rem;padding:1.6rem 1.7rem;box-shadow:0 40px 90px rgba(0,0,0,.6);transform:translateY(10px) scale(.98);transition:transform .2s;scrollbar-width:none}
.mcard.wide{width:min(46rem,100%)}
.on .mcard{transform:none}
.mt{margin:0 0 .4rem;font-size:1.3rem;font-weight:600}
.mtxt{color:var(--dim);line-height:1.55;font-size:.95rem;margin:0 0 .4rem}
.mact{display:flex;gap:.6rem;justify-content:flex-end;margin-top:1.4rem;flex-wrap:wrap}
.sheet-wrap{position:fixed;inset:0;z-index:48;background:rgba(2,3,6,.45)}
.sheet{position:absolute;top:0;bottom:0;right:0;width:25rem;max-width:92vw;background:linear-gradient(180deg,#0e1320,#090d16);border-left:1px solid var(--line2);display:flex;flex-direction:column;transform:translateX(30px);transition:transform .2s;box-shadow:-30px 0 80px rgba(0,0,0,.5)}
.sheet.left{right:auto;left:0;border-left:0;border-right:1px solid var(--line2);transform:translateX(-30px)}
.on .sheet{transform:none}
.sh-h{padding:1.6rem 1.5rem .8rem}
.sh-t{font-size:1.2rem;font-weight:600}
.sh-s{color:var(--dim);font-size:.84rem;margin-top:.25rem}
.mlist{flex:1;overflow-y:auto;padding:.3rem .8rem 1.5rem;scrollbar-width:none}
.msep{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);padding:1rem .8rem .4rem;font-weight:600}
.mi{display:flex;align-items:center;gap:.85rem;width:100%;min-height:3rem;padding:.4rem .85rem;border:0;border-radius:.75rem;background:none;text-align:left;cursor:pointer;font-size:.95rem}
.mi .mic{color:var(--dim)} .mi .ml{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mi .mh{color:var(--faint);font-size:.8rem;white-space:nowrap}
.mi .mck{color:var(--accent)}
.mi[disabled]{opacity:.4}
body.kbd .mi:focus{outline:none;background:var(--accent);color:var(--ink)}
body.kbd .mi:focus .mic,body.kbd .mi:focus .mh,body.kbd .mi:focus .mck{color:inherit}
@media (hover:hover){.mi:hover{background:rgba(255,255,255,.06)}}
.side{position:fixed;top:0;bottom:0;left:0;z-index:46;width:31rem;max-width:94vw;display:flex;flex-direction:column;background:linear-gradient(90deg,rgba(5,7,12,.98),rgba(7,10,17,.94));border-right:1px solid var(--line2);transform:translateX(-30px);transition:transform .2s}
.on .side,.side.on{transform:none}
.cp-title{padding:1.4rem 1.4rem .6rem;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);font-weight:600}
.cp-h{display:flex;align-items:center;gap:.4rem;margin:0 .9rem .6rem;padding:.3rem;border-radius:.85rem;background:rgba(255,255,255,.05)}
.cp-h .cp-g{flex:1;text-align:center;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp-h .btn{height:2.3rem;width:2.3rem}
body.kbd .cp-h:focus{outline:none;box-shadow:inset 0 0 0 2px var(--accent);background:rgba(var(--accent-rgb),.12)}
.cp-list{padding:0 .5rem}

/* ---------- PIN pad ---------- */
.pin-dots{display:flex;gap:.9rem;justify-content:center;margin:1rem 0 1.4rem}
.pin-dots i{width:1rem;height:1rem;border-radius:50%;border:2px solid var(--line2)}
.pin-dots i.f{background:var(--accent);border-color:var(--accent)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.6rem;max-width:17rem;margin:0 auto}
.pinpad .btn{height:3.2rem;font-size:1.2rem}

/* ---------- stage / player ---------- */
#stageBack{position:fixed;inset:0;z-index:18;background:#000;display:none}
#stageBack.on{display:block}
#amb{position:fixed;z-index:19;pointer-events:none;opacity:0;transition:opacity .8s;filter:blur(30px) saturate(1.6);display:block}
#amb.on{opacity:.6}
#amb.full.on{opacity:.5}
body.lite #amb{filter:saturate(1.4)}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;z-index:20;transform-origin:0 0;background:#000;display:none;overflow:hidden;cursor:pointer}
#stage.on{display:block}
#stage.anim{transition:transform .34s cubic-bezier(.2,.8,.2,1),width .34s cubic-bezier(.2,.8,.2,1),height .34s cubic-bezier(.2,.8,.2,1),border-radius .34s}
#stage.full{cursor:default}
#stage.full.amb{background:transparent}
#stage video{width:100%;height:100%;object-fit:contain;display:block;background:transparent}
#stage.fit-fill video{object-fit:cover}
#stage.fit-stretch video{object-fit:fill}
#stage.fit-zoom video{object-fit:cover;transform:scale(1.15)}
.sstat{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:1em;text-align:center;color:var(--dim);background:rgba(0,0,0,.35);pointer-events:none;font-size:calc(1rem * var(--inv,1))}
.sstat.on{display:flex}
.sstat .em{max-width:34em;font-size:1em;color:var(--text);padding:0 2em;line-height:1.5}
.sstat .em small{display:block;color:var(--dim);font-size:.85em;margin-top:.4em}
.sstat .spin{width:2.4em;height:2.4em;border-width:.2em}
.muted-tip{position:absolute;right:1.2rem;bottom:1.2rem;display:none;align-items:center;gap:.5rem;background:rgba(5,7,12,.8);padding:.6rem .9rem;border-radius:.7rem;font-size:.85rem}
#stage.full .muted-tip.on{display:flex}
#osd{position:fixed;inset:0;z-index:25;display:none;pointer-events:none}
#osd.on{display:block}
#osd > *{pointer-events:auto}
.osd-top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:1rem;padding:1.6rem 2.4rem 4rem;background:linear-gradient(180deg,rgba(3,4,8,.7),transparent);opacity:0;transition:opacity .3s;pointer-events:none}
.osd-top .sp{flex:1}
.osd-clock{font-size:1.6rem;font-weight:500;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.osd-rec{display:none;align-items:center;gap:.5rem;background:rgba(255,77,109,.18);color:#ff8fa3;padding:.35rem .7rem;border-radius:.5rem;font-size:.8rem;font-weight:700;letter-spacing:.08em}
.osd-rec.on{display:flex}
.osd-rec i{width:.6rem;height:.6rem;border-radius:50%;background:var(--live);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
.osd-bot{position:absolute;left:0;right:0;bottom:0;padding:6rem 2.6rem 2rem;background:linear-gradient(0deg,rgba(3,4,8,.96) 0%,rgba(3,4,8,.82) 40%,transparent);opacity:0;transform:translateY(16px);transition:opacity .3s,transform .3s}
#osd.show .osd-bot,#osd.show .osd-top{opacity:1;transform:none}
#osd.zap .osd-bot{opacity:1;transform:none}
#osd.zap .ob-btns{display:none}
.ob-r1{display:flex;align-items:center;gap:1rem}
.ob-r1 .logo{width:4.6rem;height:3.1rem}
.ob-num{font-size:1.7rem;font-weight:300;color:var(--dim);min-width:2.5rem}
.ob-ch{font-size:1.15rem;font-weight:500}
.ob-ch small{display:block;font-size:.78rem;color:var(--dim);font-weight:400;margin-top:.1rem}
.ob-r1 .sp{flex:1}
.ob-r1 .badges{display:flex;gap:.4rem}
.ob-title{font-size:2rem;font-weight:600;letter-spacing:-.02em;margin:1rem 0 .3rem;line-height:1.1}
.ob-meta{color:var(--dim);font-size:.92rem;display:flex;gap:.8rem;flex-wrap:wrap;align-items:center}
.ob-bar{position:relative;height:5px;border-radius:5px;background:rgba(255,255,255,.14);margin:1rem 0 .55rem}
.ob-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}
.ob-bar b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;display:none}
.ob-seek{display:flex;align-items:center;gap:1rem;border-radius:.7rem;padding:.15rem .4rem;margin:0 -.4rem}
.ob-seek .ob-bar{flex:1;margin:.6rem 0}
.ob-seek span{font-size:.85rem;color:var(--dim);min-width:4.5rem}
.ob-seek span:last-child{text-align:right}
.ob-seek .ob-bar b{display:block}
body.kbd .ob-seek:focus{outline:none;background:rgba(255,255,255,.06)}
body.kbd .ob-seek:focus .ob-bar{height:8px}
.ob-next{font-size:.88rem;color:var(--dim)}
.ob-next b{color:var(--text);font-weight:500}
.ob-btns{display:flex;gap:.6rem;margin-top:1.3rem;flex-wrap:wrap}
.ob-btns .btn{background:rgba(255,255,255,.08);border-color:transparent}
.osd-stats{position:absolute;left:2.4rem;top:5.5rem;min-width:17rem;padding:1rem 1.2rem;border-radius:.9rem;background:rgba(5,7,12,.82);border:1px solid var(--line2);font-size:.8rem;display:none}
.osd-stats.on{display:block}
.osd-stats div{display:flex;justify-content:space-between;gap:1.5rem;padding:.18rem 0}
.osd-stats div span:first-child{color:var(--faint)}
.osd-tap{position:absolute;inset:0;pointer-events:auto}
.osd-close{position:absolute;right:1.6rem;top:1.4rem;display:none}
.touch .osd-close{display:inline-flex}
.numbox{position:fixed;right:2.4rem;top:2rem;z-index:60;font-size:3.4rem;font-weight:300;letter-spacing:.06em;padding:.4rem 1.2rem;border-radius:1rem;background:rgba(5,7,12,.85);border:1px solid var(--line2);display:none}
.numbox.on{display:block}
.numbox small{display:block;font-size:.8rem;color:var(--dim);letter-spacing:0;text-align:center}

/* native Android player sits behind the page and shows through it */
html.native-on,html.native-on body{background:transparent!important}
html.native-on #stage{background:transparent!important}
html.native-on #stage video,html.native-on #amb{visibility:hidden}
html.native-on .hero::before{display:none}
html.native-slot .slot.ntarget{background:transparent}
html.native-slot .slot.ntarget .ph{visibility:hidden}
html.native-slot .slot.ntarget::after{content:'';position:absolute;inset:0;border-radius:var(--r);box-shadow:0 0 0 40px var(--bg);pointer-events:none}
html.native-full #app,html.native-full #stageBack{visibility:hidden}
/* the movie / series page steps aside while its video plays full screen */
html.full-on #layers > .detail{visibility:hidden}

/* ---------- multi-view ---------- */
#v-multi{background:#000}
.mv{position:absolute;inset:0;display:grid;gap:5px;padding:5px}
.mv.l2{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.mv.l3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}
.mv.l3 .tile:first-child{grid-row:1/span 2}
.mv.l4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.mv.l13{grid-template-columns:1fr 1fr 1fr;grid-template-rows:2fr 1fr}
.mv.l13 .tile:first-child{grid-column:1/span 3}
.mv.l6{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.mv.l6 .tile:first-child{grid-column:1/span 2;grid-row:1/span 2}
.mv.l9{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.tile{position:relative;background:#0a0e16;border-radius:.7rem;overflow:hidden;cursor:pointer;min-width:0;min-height:0}
.tile video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.tile::after{content:'';position:absolute;inset:0;border-radius:.7rem;pointer-events:none;transition:box-shadow .15s}
.tile.aud::after{box-shadow:inset 0 0 0 2px rgba(var(--accent-rgb),.55)}
body.kbd .tile:focus{outline:none}
body.kbd .tile:focus::after{box-shadow:inset 0 0 0 4px var(--accent)}
.tile .lbl{position:absolute;left:.6rem;right:.6rem;bottom:.6rem;display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;border-radius:.65rem;background:rgba(5,7,12,.78);transition:opacity .4s;pointer-events:none}
.tile .lbl .logo{width:2.6rem;height:1.8rem}
.tile .lbl .mid{flex:1;min-width:0}
.tile .lbl .a{font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .lbl .b{font-size:.72rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile.quiet .lbl{opacity:0}
.tile .spk{position:absolute;right:.6rem;top:.6rem;width:2rem;height:2rem;border-radius:50%;display:none;place-items:center;background:var(--accent);color:var(--ink)}
.tile .spk svg{width:1.1rem;height:1.1rem}
.tile.aud .spk{display:grid}

.tile .mt-empty svg{width:2.2rem;height:2.2rem}
.tile .tstat{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--dim);font-size:.85rem;text-align:center;padding:1rem;pointer-events:none}

.mv-hint.off{opacity:0}
.mv-tools{position:absolute;right:1rem;top:1rem;z-index:6;display:none;gap:.5rem}
.touch .mv-tools{display:flex}

#toasts{position:fixed;right:1.4rem;top:1.4rem;z-index:70;display:flex;flex-direction:column;gap:.6rem;align-items:flex-end;pointer-events:none}

#busy{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;background:rgba(2,3,6,.75)}
#busy.on{display:flex}

#busy .bm{font-size:1rem} #busy .bs{font-size:.8rem;color:var(--dim);margin-top:-.6rem}
#boot{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:1.2rem;background:var(--bg);transition:opacity .5s}
#boot svg{width:4.2rem;height:4.2rem;animation:pulse 1.6s ease-in-out infinite}
#boot b{font-size:1.5rem;font-weight:600;letter-spacing:-.01em}
#boot.out{opacity:0;pointer-events:none}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}

body.lite .rail.open,body.lite .mcard,body.lite .sheet,body.lite .toast{box-shadow:none}
body.lite .ccard,body.lite .pcard .pst,body.lite .btn{transition:none}
body.lite .rail,body.lite .rail *,body.lite #layers > *,body.lite .mcard,body.lite .sheet,body.lite .side{transition:none!important}
body.lite .hero::before{display:none}
body.lite .eq i{animation:none;height:70%}

    actions: [{ label: 'Cancel' }, {
      label: 'Add', pri: true, on: async () => {
        const pl = D.pl; pl.epg = pl.epg || []; const u = inp.value.trim(); const fl = file.files && file.files[0];
        if (fl) { const id = uid(); await IDB.set('epgfile:' + id, await fl.arrayBuffer()); pl.epg.push('file:' + id); }
        else if (/^https?:\/\//i.test(u)) pl.epg.push(u); else { toast('Paste a link starting with http, or choose a file', { type: 'err' }); return false; }
        savePLS(); refreshEPG(pl).then(() => Views.settings.open('guide')); Views.settings.open('guide');
      },
    }],
  });
}

/* =========================================================
   Lumen TV — start-up, background jobs, wiring
   ========================================================= */
function clearData() {
  Object.assign(D, { pl: null, channels: [], byKey: new Map(), byNum: new Map(), byGroup: new Map(), groups: [], movies: null, series: null, mcats: [], scats: [], epgUrls: [], info: null, epgRaw: null, chEpg: new Map() });
  D.epgState = { busy: false, msg: '', at: 0, count: 0, matched: 0 };
}
async function activate(id, { force } = {}) {
  const pl = PLS.find(p => p.id === id); if (!pl) return false;
  if (View.curName === 'multi') MV.stopAll();
  Stage.stop(); Stage.ch = null; Stage.prevCh = null; Stage.list = null;
  const prev = D.pl;
  Busy.show(force ? `Refreshing ${pl.name}…` : `Loading ${pl.name}…`, pl.type === 'xtream' ? 'Signing in to your provider' : '');
  try { clearData(); await loadPlaylist(pl, { force }); }
  catch (e) {
    Busy.hide(); console.error(e);
    modal({ title: "Couldn't load the playlist", text: e.message, actions: [{ label: 'OK', pri: true, focus: true }] });
    if (prev && prev.id !== pl.id) { try { await loadPlaylist(prev); loadEPG().catch(() => { }); } catch { } }
    return false;
  }
  Busy.hide();
  ST.active = id; saveST(); pinUnlocked = false;
  if (Env.android) Android.call('setUserAgent', pl.ua || S.ua || '');
  const n = D.channels.length;
  toast(n ? `${pl.name}: ${fmtN(n)} channels` : `${pl.name} loaded`, { icon: 'check' });
  Bus.emit('data');
  loadEPG({ force }).catch(e => console.warn(e));
  if (pl.type === 'xtream') setTimeout(() => { if (D.pl === pl) ensureVod('movies').then(() => ensureVod('series')).then(() => { if (View.curName === 'home') Views.home.render(); }).catch(() => { }); }, 6000);
  return true;
}

/* ---------- live updates ---------- */
Bus.on('data', () => { Views.live.gk = null; Views.guide.gk = '__all'; Views.movies.cat = Views.series.cat = null; if (View.cur) View.refresh(); });
Bus.on('epg', () => {
  const c = View.curName;
  if (c === 'live') Views.live.refreshRows();
  else if (c === 'guide') Views.guide.build(true);
  else if (c === 'home' && !$('#v-home').contains(document.activeElement)) Views.home.render();
  OSD.render();
});
Bus.on('epgstatus', () => { if (View.curName === 'guide') Views.guide.epgStatus(); if (View.curName === 'settings' && Views.settings.sec === 'guide' && !D.epgState.busy) Views.settings.open('guide'); });
Bus.on('fav', () => { if (View.curName === 'live') { Views.live.renderGroups(); Views.live.refreshRows(); } });
Bus.on('groups', () => { if (View.curName === 'live') Views.live.show(); });
Bus.on('playing', () => { if (View.curName === 'live') Views.live.vs.refresh(); if (View.curName === 'guide') Views.guide.markRows(); });

/* ---------- global shortcuts ---------- */
Keys.global = k => {
  if (/^d\d$/.test(k) && D.channels.length && View.curName !== 'search' && View.curName !== 'settings' && !Nav.top()) { NumEntry.push(k[1]); return true; }
  if (Nav.top()) return false;
  const go = { kg: 'guide', kl: 'live', kh: 'home', 'k/': 'search', ks: 'settings' }[k];
  if (go) { View.show(go); return true; }
  if (k === 'km') { MV.openWith(null); return true; }
  if (k === 'playpause' && Stage.mode === 'slot') { Stage.full(); return true; }
  return false;
};

/* ---------- clock, progress bars, reminders, sleep timer ---------- */
function tickClock() {
  const now = Date.now(); const t = fmtT(now);
  $('#railClock').innerHTML = esc(t).replace(/ (AM|PM)$/, '<small> $1</small>'); $('#osdClock').textContent = t;
  $('#railDate').textContent = new Date(now).toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
}
function tick30() {
  const c = View.curName;
  if (c === 'live' && !Nav.top()) Views.live.refreshRows();
  if (c === 'guide') { Views.guide.render(true); Views.guide.corner.textContent = fmtT(Date.now()); }
  if (OSD.el.classList.contains('on')) { const f = document.activeElement; if (!OSD.bot.contains(f)) OSD.render(); }
}
function checkReminders() {
  const now = Date.now(); let changed = false;
  for (const r of ST.rem) {
    if (r.fired || r.s > now + 45000) continue;
    r.fired = true; changed = true;
    if (r.e < now || !D.pl || r.pl !== D.pl.id) continue;
    const ch = D.byKey.get(r.k); if (!ch) continue;
    if (S.remSwitch) { toast(`Starting now: ${r.t}`, { icon: 'bell' }); Stage.playChannel(ch, { full: true }); continue; }
    modal({ title: 'Starting now', text: `${r.t} on ${r.ch} (${fmtT(r.s)})`, actions: [{ label: 'Dismiss' }, { label: 'Watch', pri: true, focus: true, on: () => { if (View.curName === 'multi') View.show('live', { focus: false }); setTimeout(() => Stage.playChannel(ch, { full: true }), 30); } }] });
  }
  const before = ST.rem.length; ST.rem = ST.rem.filter(r => r.e > now - 36e5);
  if (changed || before !== ST.rem.length) saveST();
}

/* ---------- boot ---------- */
async function boot() {
  applyTheme(); buildRail(); Amb.init(); Stage.init(); OSD.init();
  await detectEnv();
  Views.home.el = $('#v-home');
  ensureHls(); ensureTs();
  tickClock(); setInterval(tickClock, 15000); setInterval(tick30, 30000);
  setInterval(() => { checkReminders(); Sleep.check(); }, 15000);
  setInterval(() => { if (D.pl && !D.epgState.busy && D.epgState.at && Date.now() - D.epgState.at > S.epgRefresh * 36e5) refreshEPG(D.pl).catch(() => { }); }, 15 * 6e4);
  window.__lumenLifecycle = s => { if (s === 'pause') { Stage.saveResume(); if (Stage.mode !== 'off') { Stage.eng.pause(true); } MV.stopAll(); } if (s === 'resume') { if (Stage.mode !== 'off') Stage.retry(); if (View.curName === 'multi') MV.enter(); } };
  const active = PLS.find(p => p.id === ST.active) || PLS[0];
  let start = 'home';
  if (active) {
    try { await loadPlaylist(active); ST.active = active.id; saveST(); if (Env.android) Android.call('setUserAgent', active.ua || S.ua || ''); }
    catch (e) { console.error(e); setTimeout(() => modal({ title: "Couldn't load your playlist", text: e.message + ' You can try again from Settings › Playlists.', actions: [{ label: 'Open settings', on: () => { Views.settings.sec = 'playlists'; View.show('settings'); } }, { label: 'OK', pri: true, focus: true }] }), 600); clearData(); }
  }
  $('#boot').classList.add('out'); setTimeout(() => $('#boot').remove(), 600);
  View.show(start);
  if (D.pl) {
    loadEPG().catch(e => console.warn(e));
    if (D.pl.type === 'xtream') setTimeout(() => ensureVod('movies').then(() => ensureVod('series')).then(() => { if (View.curName === 'home' && !$('#v-home').contains(document.activeElement)) Views.home.render(); }).catch(() => { }), 8000);
    if (S.autoFull) { const last = D.byKey.get(ST.last[D.pl.id]); if (last && !isLockedG(last.group)) setTimeout(() => Stage.playChannel(last, { full: true }), 400); }
  }
  if (Env.mode === 'direct' && !LS.get('seenDirect', false) && location.protocol === 'file:') {
    LS.set('seenDirect', true);
    setTimeout(() => toast('Tip: for the widest provider support, open Lumen through the home-computer helper or the Fire Stick app.', { icon: 'info', ms: 8000 }), 2500);
  }
}
boot();

</script>
